<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Eurowindow CAD Viewer Runtime</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      min-width: 100%;
      min-height: 100%;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      background-color: #121212;
      touch-action: none;
    }
    #cad-container {
      width: 100vw;
      height: 100vh;
      min-width: 100%;
      min-height: 100%;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      touch-action: none;
      overflow: hidden;
    }
    .ml-ui-simple-toolbar,
    .ml-ui-simple-toolbar-host,
    .ml-ui-shortcut-toolbar,
    .ml-ui-shortcut-toolbar-shell,
    .ml-notification-center,
    .ml-ui-notification-center,
    .ml-ui-touch-point-tutorial,
    .ml-ccl-loader,
    .ml-ccl-overlay,
    .ml-ccl-wrapper,
    .ml-cli-container,
    .ml-cli-wrapper,
    [class*="notification-center"] {
      display: none !important;
    }
    /* Position live measurement & command HUD cleanly above bottom dock bar */
    .ml-mobile-cmd-panel {
      bottom: 68px !important;
      z-index: 50 !important;
    }
    /* High-visibility OSNAP markers & Magnifier Loupe */
    .ml-snap-loupe {
      border: 2px solid #00e5ff !important;
      border-radius: 10px !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.75) !important;
      z-index: 60 !important;
    }
    .ml-marker {
      color: #00ff66 !important;
      filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.95));
      z-index: 55 !important;
    }
    .ml-simulated-mouse-cursor {
      color: #00e5ff !important;
      z-index: 56 !important;
    }
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      background: #121212;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      color: #90caf9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.25s ease-out;
    }
    .spinner {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border: 4px solid rgba(144, 202, 249, 0.2);
      border-top-color: #90caf9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #status-text {
      font-size: 14px;
      letter-spacing: 0.5px;
      text-align: center;
      padding: 0 24px;
    }
  </style>
</head>
<body>
  <div id="cad-container"></div>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="status-text">Đang khởi tạo Eurowindow CAD Engine...</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
