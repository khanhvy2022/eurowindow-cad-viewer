<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Deep Navy / Eurowindow Blue) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071326"/>
      <stop offset="50%" stop-color="#0B2B5C"/>
      <stop offset="100%" stop-color="#154B98"/>
    </linearGradient>

    <!-- Glass Pane Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Metallic Aluminum Profile Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Gold CAD Dimension Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Soft Depth Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020A17" flood-opacity="0.6"/>
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Icon Shape (Squircle with 112px radius) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>

  <!-- Blueprint CAD Grid Lines -->
  <g stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.16">
    <line x1="64" y1="16" x2="64" y2="496"/>
    <line x1="128" y1="16" x2="128" y2="496"/>
    <line x1="192" y1="16" x2="192" y2="496"/>
    <line x1="256" y1="16" x2="256" y2="496" stroke-opacity="0.32" stroke-width="2"/>
    <line x1="320" y1="16" x2="320" y2="496"/>
    <line x1="384" y1="16" x2="384" y2="496"/>
    <line x1="448" y1="16" x2="448" y2="496"/>

    <line x1="16" y1="64" x2="496" y2="64"/>
    <line x1="16" y1="128" x2="496" y2="128"/>
    <line x1="16" y1="192" x2="496" y2="192"/>
    <line x1="16" y1="256" x2="496" y2="256" stroke-opacity="0.32" stroke-width="2"/>
    <line x1="16" y1="320" x2="496" y2="320"/>
    <line x1="16" y1="384" x2="496" y2="384"/>
    <line x1="16" y1="448" x2="496" y2="448"/>
  </g>

  <!-- CAD Crosshair Center Mark -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="6 6"/>

  <!-- Main Architectural Window CAD Emblem with 3D Depth -->
  <g filter="url(#dropShadow)">
    <!-- Outer Window Frame (White/Aluminum Chamfered Profile) -->
    <rect x="108" y="96" width="296" height="320" rx="20" fill="url(#metalGrad)"/>

    <!-- Inner Window Profile Offset (Dark Blueprint Inner Depth) -->
    <rect x="124" y="112" width="264" height="288" rx="12" fill="#061A38"/>

    <!-- Glass Pane 1 (Top-Left) -->
    <rect x="136" y="124" width="116" height="128" rx="6" fill="url(#glassGrad)"/>
    <path d="M136 124 L200 124 L136 200 Z" fill="#FFFFFF" opacity="0.25"/>

    <!-- Glass Pane 2 (Top-Right) -->
    <rect x="260" y="124" width="116" height="128" rx="6" fill="url(#glassGrad)"/>
    <path d="M260 124 L324 124 L260 200 Z" fill="#FFFFFF" opacity="0.25"/>

    <!-- Glass Pane 3 (Bottom-Left) -->
    <rect x="136" y="260" width="116" height="128" rx="6" fill="url(#glassGrad)"/>
    <path d="M136 260 L180 260 L136 310 Z" fill="#FFFFFF" opacity="0.2"/>

    <!-- Glass Pane 4 (Bottom-Right) -->
    <rect x="260" y="260" width="116" height="128" rx="6" fill="url(#glassGrad)"/>
    <path d="M260 260 L304 260 L260 310 Z" fill="#FFFFFF" opacity="0.2"/>

    <!-- Mullion & Transom Center Cross (Aluminum) -->
    <rect x="248" y="112" width="16" height="288" fill="url(#metalGrad)"/>
    <rect x="124" y="248" width="264" height="16" fill="url(#metalGrad)"/>
  </g>

  <!-- Prominent Modern EW Monogram & CAD Drafting Crosshair Caliper Badge -->
  <g filter="url(#dropShadow)">
    <!-- Brand Emblem Pill (Bottom Right Elevation) -->
    <rect x="190" y="300" width="240" height="96" rx="24" fill="#0A1E3F" stroke="#38BDF8" stroke-width="3"/>
    
    <!-- Bold "EW" Monogram (Eurowindow Red/Cyan Accent) -->
    <!-- E Mark -->
    <path d="M224 326 H268 V338 H238 V344 H264 V356 H238 V362 H268 V374 H224 Z" fill="#FFFFFF"/>
    
    <!-- W Mark with precision CAD facet -->
    <path d="M280 326 H294 L306 358 L318 326 H332 L344 358 L356 326 H370 L352 374 H336 L324 344 L312 374 H296 Z" fill="#38BDF8"/>

    <!-- CAD Label -->
    <text x="382" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#FBBF24" letter-spacing="1.5">CAD</text>
  </g>

  <!-- Precision CAD Dimension Marker Overlay (Top Right: "< 55 >") -->
  <g filter="url(#subtleShadow)">
    <!-- Dimension Witness Lines -->
    <line x1="108" y1="74" x2="108" y2="92" stroke="#FBBF24" stroke-width="2.5"/>
    <line x1="404" y1="74" x2="404" y2="92" stroke="#FBBF24" stroke-width="2.5"/>
    <line x1="112" y1="80" x2="398" y2="80" stroke="#FBBF24" stroke-width="2.5"/>

    <!-- Arrowheads -->
    <polygon points="108,80 120,75 120,85" fill="#FBBF24"/>
    <polygon points="404,80 392,75 392,85" fill="#FBBF24"/>

    <!-- Dimension Pill Tag -->
    <rect x="216" y="66" width="80" height="28" rx="8" fill="#071326" stroke="#FBBF24" stroke-width="2"/>
    <text x="256" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#FBBF24" text-anchor="middle">EA55</text>
  </g>
</svg>
