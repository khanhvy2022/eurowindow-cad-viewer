name: Build & Package Eurowindow CAD Viewer APK

on:
  push:
    branches:
      - master
      - main
      - 'feature/**'
    tags:
      - 'v*'
      - 'checkpoint-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          cd android
          chmod +x gradlew || true

      - name: Run Unit & Contract Tests
        run: |
          cd android
          ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble APKs (Debug & Release)
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Rename and Prepare APKs
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk com.eurowindow.cadviewer-v1.0.4-release.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk com.eurowindow.cadviewer-debug.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eurowindow-cadviewer-apks
          path: |
            com.eurowindow.cadviewer-v1.0.4-release.apk
            com.eurowindow.cadviewer-debug.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            com.eurowindow.cadviewer-v1.0.4-release.apk
            com.eurowindow.cadviewer-debug.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
