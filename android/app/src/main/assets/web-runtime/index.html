<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Eurowindow CAD Viewer Runtime</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      touch-action: none;
    }
    #cad-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      touch-action: none;
    }
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #121212;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      color: #90caf9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.25s ease-out;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(144, 202, 249, 0.2);
      border-top-color: #90caf9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #status-text {
      font-size: 14px;
      letter-spacing: 0.5px;
    }
  </style>
  <script type="module" crossorigin src="./viewer-DQ6t1ZEI.js"></script>
</head>
<body>
  <div id="cad-container"></div>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="status-text">Đang khởi tạo Eurowindow CAD Engine...</div>
  </div>
</body>
</html>
